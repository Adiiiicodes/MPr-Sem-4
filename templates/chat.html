<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OS Notes Chat</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <style>
    :root {
      --primary: #e0e0e0;
      --secondary: #2a2a2a;
      --accent: #00f7ff;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-bg-heavy: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --blur: blur(12px);
      --user-message: rgba(0, 247, 255, 0.1);
      --bot-message: rgba(255, 255, 255, 0.05);
    }

    /* 
     * Make body fill the entire page
     */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Hide scrollbars if you want the entire UI to be self-contained */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f1624, #1a1f35);
      color: var(--primary);
    }

    .bg-elements {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(80px);
      opacity: 0.1;
      animation: float 20s infinite ease-in-out;
    }
    .bg-circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }
    .bg-circle:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: 20%;
      right: 15%;
      animation-delay: -5s;
      background: #ff00d4;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, -30px); }
    }

    /*
     * NAVBAR
     */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--glass-border);
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    .logo span {
      color: var(--accent);
    }

    /*
     * CHAT LAYOUT: fill the entire screen below the navbar
     */
    .chat-container {
      position: absolute;
      top: 60px; /* ~the navbar height */
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      overflow: hidden; /* so the content fits within this area */
    }

    .messages {
      flex: 1;             /* take all remaining space */
      overflow-y: auto;    /* scroll vertically */
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      border-radius: 8px;  /* smaller corners */
      border: 1px solid var(--glass-border);
      padding: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--glass-bg);
    }
    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-track {
      background: var(--glass-bg);
    }
    .messages::-webkit-scrollbar-thumb {
      background-color: var(--accent);
      border-radius: 3px;
    }

    .message {
      margin: 0.75rem 0;
      padding: 1rem 1.5rem;
      border-radius: 8px; /* smaller corners */
      max-width: 85%;
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }
    .message:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    .user-message {
      background: var(--user-message);
      color: var(--primary);
      margin-left: auto;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(0, 247, 255, 0.2);
    }
    .bot-message {
      background: var(--bot-message);
      color: var(--primary);
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    /* Style structured content in bot messages */
    .bot-message h1, .bot-message h2, .bot-message h3,
    .bot-message h4, .bot-message h5, .bot-message h6 {
      margin: 0.7em 0 0.3em;
      font-weight: bold;
    }
    .bot-message p {
      margin: 0.5em 0;
      line-height: 1.4;
    }
    .bot-message ul {
      margin: 0.5em 1.5em;
      list-style: disc;
    }
    .bot-message li {
      margin: 0.3em 0;
      line-height: 1.4;
    }
    .bot-message code {
      background-color: rgba(255,255,255,0.08);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: "Courier New", Courier, monospace;
    }
    .bot-message pre {
      background-color: rgba(255,255,255,0.08);
      padding: 0.8em;
      border-radius: 4px;
      font-family: "Courier New", Courier, monospace;
      overflow-x: auto;
      margin: 0.5em 0;
    }

    .input-container {
      display: flex;
      gap: 0.5rem;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      border-radius: 8px; /* smaller corners */
      border: 1px solid var(--glass-border);
      padding: 0.5rem;
    }
    #user-input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--glass-bg-heavy);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: var(--primary);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    #user-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 247, 255, 0.2);
    }
    #user-input::placeholder {
      color: rgba(224, 224, 224, 0.5);
    }

    #send-button {
      padding: 0.75rem 1rem;
      background: var(--glass-bg-heavy);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #send-button:hover {
      background: var(--accent);
      color: var(--secondary);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.3);
      transform: translateY(-2px);
    }

    /* 
     * Responsive adjustments if you want them
     */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
      }
      .chat-container {
        top: 50px;
        padding: 0.5rem;
      }
      .message {
        max-width: 95%;
      }
    }
  </style>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSChat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="bg-elements">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>
  
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">OS<span>Chat</span></div>
    </nav>
  
    <!-- CHAT CONTAINER -->
    <div class="chat-container">
      <div class="messages" id="chat-messages">
        <!-- Initial welcome message -->
        <div class="message bot-message">
          Welcome to OSChat! Ask me anything about Operating Systems. I'm here to help you learn and understand OS concepts better.
        </div>
      </div>
  
      <div class="input-container">
        <input type="text" id="user-input" placeholder="Ask about OS concepts..." />
        <button id="send-button">
          <i class="fas fa-paper-plane"></i>
          Send
        </button>
      </div>
    </div>
  
    <script>
      const messagesDiv = document.getElementById('chat-messages');
      const userInput = document.getElementById('user-input');
      const sendButton = document.getElementById('send-button');

      const BACKEND_URL = "https://df79-182-48-220-13.ngrok-free.app"
  
      function addMessage(content, isUser = false) {
          const messageDiv = document.createElement('div');
          messageDiv.classList.add('message');
          messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
          messageDiv.textContent = content;
          messagesDiv.appendChild(messageDiv);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
  
      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;
      
        addMessage(message, true);
        userInput.value = '';
      
        try {
          const response = await fetch(`${BACKEND_URL}/api/chat`, {  // Use BACKEND_URL here
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: message })
          });
      
          const data = await response.json();
          if (response.ok) {
            // Update this part to render HTML instead of text
            addMessage(data.answer, false);
          } else {
            addMessage('Sorry, I encountered an error. Please try again.', false);
          }
        } catch (error) {
          addMessage('Sorry, I encountered an error. Please try again.', false);
        }
      }
      
      // Update addMessage to handle HTML rendering
      function addMessage(content, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
      
        if (!isUser) {
          // Use innerHTML to render HTML from the response
          messageDiv.innerHTML = content;  // This allows HTML tags to be rendered
        } else {
          messageDiv.textContent = content;  // User messages as plain text
        }
      
        // Simple fade-in style
        messageDiv.style.opacity = '0';
        messageDiv.style.transform = 'translateY(20px)';
        messagesDiv.appendChild(messageDiv);
      
        setTimeout(() => {
          messageDiv.style.transition = 'all 0.3s ease';
          messageDiv.style.opacity = '1';
          messageDiv.style.transform = 'translateY(0)';
        }, 50);
      
        // Autoscroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
      
  
      sendButton.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') sendMessage();
      });
  </script>
  
  </body>
</html>
