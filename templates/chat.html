<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OS Notes Chat</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <style>
    :root {
      --primary-color: #00f7ff;
      --secondary-color: #7e3ff2;
      --background-dark: #0a0a1a;
      --text-color: #e0e0ff;
      --glass-bg: rgba(126, 63, 242, 0.1);
      --glass-border: rgba(0, 240, 255, 0.2);
      --gradient-primary: linear-gradient(45deg, #00f0ff, #7e3ff2);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Roboto', sans-serif;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) transparent;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--background-dark);
      color: var(--text-color);
      perspective: 1000px;
      scroll-behavior: smooth;
    }
    
    /* Background Animated Elements */
    .bg-elements {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, 
          rgba(126, 63, 242, 0.3), 
          rgba(0, 240, 255, 0.1)
      );
      animation: float 15s infinite alternate;
      filter: blur(80px);
      opacity: 0.6;
    }
    
    .bg-circle:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -250px;
      right: -250px;
      animation-delay: -3s;
    }
    
    .bg-circle:nth-child(2) {
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -150px;
      animation-delay: -7s;
    }
    
    @keyframes float {
      0% { 
        transform: translateY(0) rotate(0deg) scale(1); 
      }
      100% { 
        transform: translateY(50px) rotate(360deg) scale(1.1); 
      }
    }
    
    /* Navbar Styling */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 35px;  /* Increased padding */
      background: rgba(126, 63, 242, 0.05);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(126, 63, 242, 0.1);
      transition: all 0.4s ease;
    }
    
    .logo {
      font-size: 1.7rem;  /* Larger logo size */
      font-weight: bold;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.3s ease;
      will-change: transform;
    }
    
    .logo:hover {
      transform: scale(1.1) rotate(5deg);
    }
    
    /* Chat Container */
    .chat-container {
      position: absolute;
      top: 30px; /* ~the navbar height */
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;  /* Increased gap between elements */
      padding: 1rem 2rem;  /* More padding */
      overflow: hidden;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      background: rgba(126, 63, 242, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 30px;  /* Increased padding */
      margin-bottom: 30px;  /* More space between messages and input */
      box-shadow: 0 15px 40px rgba(126, 63, 242, 0.1);
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) transparent;
      transition: all 0.4s ease;
      gap: 15px;  /* Space between messages */
      line-height: 1.6;  /* Increased line height for readability */
    }
    
    .messages::-webkit-scrollbar {
      width: 10px;
    }
    
    .messages::-webkit-scrollbar-thumb {
      background: var(--gradient-primary);
      border-radius: 10px;
    }
    
    .message {
      margin: 30px 0;  /* More margin between each message */
      padding: 15px 25px;  /* Increased padding */
      border-radius: 20px;
      font-size: 1.2rem;  /* Larger font size */
      max-width: 90%;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, box-shadow;
      animation: fadeInSlide 0.6s ease forwards;
      opacity: 0;
    }
    
    .message::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      opacity: 0.5;
      z-index: -1;
      transform: scale(1.2);
      filter: blur(15px);
    }
    
    .user-message {
      background: rgba(0, 247, 255, 0.1);
      color: var(--text-color);
      margin-left: auto;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(0, 247, 255, 0.2);
      transform: perspective(500px) rotateY(-5deg);
    }
    
    .bot-message {
      background: rgba(126, 63, 242, 0.1);
      color: var(--text-color);
      margin-right: auto;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--glass-border);
      transform: perspective(500px) rotateY(5deg);
    }
    
    .message:hover {
      transform: translateY(-15px) scale(1.03);
      box-shadow: 0 20px 40px rgba(126, 63, 242, 0.3);
    }
    
    /* Input Container */
    .input-container {
      display: flex;
      align-items: center;
      gap: 7px;  /* Increased gap */
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      padding: 10px 12px;  /* Increased padding */
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(126, 63, 242, 0.1);
    }
    
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.1rem;  /* Larger font size */
      outline: none;
      caret-color: var(--primary-color);
    }
    
    #user-input::placeholder {
      color: rgba(224, 224, 255, 0.5);
    }
    
    #send-button {
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 17px;  /* Increased padding */
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
    }
    
    #send-button:hover {
      transform: translateY(-7px) rotateX(15deg);
      box-shadow: 0 15px 40px rgba(126, 63, 242, 0.4);
    }
    
    #send-button i {
      transition: transform 0.3s ease;
    }
    
    #send-button:hover i {
      transform: rotate(360deg);
    }
    
    /* Animations */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .animate-pulse {
      animation: pulse 2s infinite;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar {
        padding: 20px 30px;
      }
    
      .chat-container {
        padding: 0 15px;
        height: calc(100vh - 80px);
      }
    
      .input-container {
        flex-direction: column;
        border-radius: 15px;
      }
    
      #send-button {
        width: 100%;
        justify-content: center;
      }
    
      .message {
        max-width: 95%;
      }
    
      .logo {
        font-size: 2rem;
      }
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--background-dark);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--gradient-primary);
      border-radius: 5px;
    }
    
    /* Accessibility and Performance Enhancements */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
    
  </style>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSChat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="bg-elements">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>
  
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">NoteBot<span></span></div>
    </nav>
  
    <!-- CHAT CONTAINER -->
    <div class="chat-container">
      <div class="messages" id="chat-messages">
        <!-- Initial welcome message -->
        <div class="message bot-message">
          Welcome to NoteBot! Ask me anything about engineering concepts. I'm here to help you learn and understand concepts better.
        </div>
      </div>
  
      <div class="input-container">
        <input type="text" id="user-input" placeholder="Ask about concepts..." />
        <button id="send-button">
          <i class="fas fa-paper-plane"></i>
          Send
        </button>
      </div>
    </div>
  
    <script>
      const messagesDiv = document.getElementById('chat-messages');
      const userInput = document.getElementById('user-input');
      const sendButton = document.getElementById('send-button');

      const BACKEND_URL = "https://91c5-36-255-9-10.ngrok-free.app"
  
      function addMessage(content, isUser = false) {
          const messageDiv = document.createElement('div');
          messageDiv.classList.add('message');
          messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
          messageDiv.textContent = content;
          messagesDiv.appendChild(messageDiv);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
  
      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;
      
        addMessage(message, true);
        userInput.value = '';
      
        try {
          const response = await fetch(`${BACKEND_URL}/api/chat`, {  // Use BACKEND_URL here
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: message })
          });
      
          const data = await response.json();
          if (response.ok) {
            // Update this part to render HTML instead of text
            addMessage(data.answer, false);
          } else {
            addMessage('Sorry, I encountered an error. Please try again.', false);
          }
        } catch (error) {
          addMessage('Sorry, I encountered an error. Please try again.', false);
        }
      }
      
      // Update addMessage to handle HTML rendering
      function addMessage(content, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
      
        if (!isUser) {
          // Use innerHTML to render HTML from the response
          messageDiv.innerHTML = content;  // This allows HTML tags to be rendered
        } else {
          messageDiv.textContent = content;  // User messages as plain text
        }
      
        // Simple fade-in style
        messageDiv.style.opacity = '0';
        messageDiv.style.transform = 'translateY(20px)';
        messagesDiv.appendChild(messageDiv);
      
        setTimeout(() => {
          messageDiv.style.transition = 'all 0.3s ease';
          messageDiv.style.opacity = '1';
          messageDiv.style.transform = 'translateY(0)';
        }, 50);
      
        // Autoscroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
      
  
      sendButton.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') sendMessage();
      });
  </script>
  
  </body>
</html>
