<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteBot Admin - PDF Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f0ff;
            --secondary-color: #7e3ff2;
            --background-dark: #0a0a1a;
            --text-color: #e0e0ff;
            --gradient-primary: linear-gradient(45deg, #00f0ff, #7e3ff2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .upload-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(126,63,242,0.1);
        }

        .upload-area.dragover {
            background: rgba(126,63,242,0.2);
            border-color: var(--secondary-color);
        }

        .upload-icon {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .upload-text {
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: var(--gradient-primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(126,63,242,0.4);
        }

        #fileList {
            margin-top: 20px;
            padding: 10px;
        }

        .file-item {
            background: rgba(126,63,242,0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .term-title, .progress-counter, .progress-log, .stage .label {
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
        }

        .progress-panel {
            background: rgba(126,63,242,0.06);
            border: 1px solid rgba(0,240,255,0.25);
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        .term-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0,240,255,0.12);
        }

        .term-dots {
            display: flex;
            gap: 5px;
        }

        .term-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(224,224,255,0.25);
        }

        .term-title {
            flex: 1;
            margin: 0 10px;
            font-size: 11px;
            letter-spacing: 0.03em;
            color: rgba(224,224,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .term-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(224,224,255,0.4);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(224,224,255,0.3);
        }

        .progress-panel.processing .status-dot {
            background: var(--primary-color);
            animation: pulse-dot 1.4s ease-in-out infinite;
        }

        .progress-panel.done .status-dot { background: var(--primary-color); }
        .progress-panel.error .status-dot { background: #ff4444; }
        .progress-panel.error .term-status { color: #ff4444; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stage-tracker {
            display: flex;
            align-items: flex-start;
            padding: 14px 16px 4px;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .stage .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1.5px solid rgba(224,224,255,0.25);
            background: transparent;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .stage .label {
            font-size: 9px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(224,224,255,0.35);
            transition: color 0.3s ease;
        }

        .stage.active .dot {
            border-color: var(--primary-color);
            background: var(--primary-color);
            box-shadow: 0 0 6px rgba(0,240,255,0.6);
            animation: pulse-dot 1.4s ease-in-out infinite;
        }
        .stage.active .label { color: var(--primary-color); }

        .stage.complete .dot {
            border-color: var(--primary-color);
            background: var(--primary-color);
        }
        .stage.complete .label { color: rgba(224,224,255,0.7); }

        .stage.error .dot { border-color: #ff4444; background: #ff4444; }
        .stage.error .label { color: #ff4444; }

        .stage-line {
            flex: 1;
            height: 1px;
            background: rgba(224,224,255,0.15);
            margin: 4px 4px 0;
            position: relative;
            overflow: hidden;
        }

        .stage-line .fill {
            position: absolute;
            inset: 0;
            width: 0%;
            background: var(--primary-color);
            transition: width 0.4s ease;
        }

        .progress-bar-track {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            height: 4px;
            overflow: hidden;
            margin: 12px 16px 4px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient-primary);
            transition: width 0.2s ease;
        }

        .progress-counter {
            font-size: 10px;
            color: rgba(224,224,255,0.4);
            padding: 0 16px 8px;
            text-align: right;
        }

        .progress-log {
            list-style: none;
            background: rgba(0,0,0,0.3);
            margin: 0 12px 12px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            max-height: 110px;
            overflow-y: auto;
        }

        .progress-log::-webkit-scrollbar { width: 4px; }
        .progress-log::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.25); border-radius: 4px; }

        .progress-log li {
            display: flex;
            gap: 8px;
            padding: 2px 0 2px 6px;
            border-left: 2px solid transparent;
            animation: log-in 0.25s ease;
        }

        .progress-log li .ts { color: rgba(224,224,255,0.3); flex-shrink: 0; }
        .progress-log li .msg { color: rgba(224,224,255,0.75); }

        .progress-log li.tag-parse, .progress-log li.tag-split { border-left-color: var(--secondary-color); }
        .progress-log li.tag-embed { border-left-color: var(--primary-color); }
        .progress-log li.tag-done { border-left-color: var(--primary-color); }
        .progress-log li.tag-done .msg { color: var(--primary-color); }
        .progress-log li.tag-error { border-left-color: #ff4444; }
        .progress-log li.tag-error .msg { color: #ff4444; }

        @keyframes log-in {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .status-dot, .stage.active .dot, .progress-log li {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div id="passwordSection" style="margin-bottom: 20px; text-align: center;">
            <input type="password" id="adminPassword" placeholder="Enter admin password" 
                style="padding: 10px; border-radius: 5px; background: rgba(126,63,242,0.1); 
                border: 1px solid var(--primary-color); color: var(--text-color);">
            <button onclick="verifyPassword()" class="upload-btn">Verify</button>
        </div>
        <div id="uploadSection" style="display: none;">
            <div id="uploadArea" class="upload-area">
                <i class="fas fa-file-pdf upload-icon"></i>
                <div class="upload-text">
                    <h2>Upload PDF File</h2>
                    <p>Drag and drop your PDF here or click to select</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".pdf">
                <button class="upload-btn">Choose File</button>
            </div>
            <div id="fileList"></div>
        </div>
    </div>

    <script>
        // Add this at the beginning of your script section
        const ADMIN_PASSWORD = "admin123"; // Change this to your desired password
        const passwordSection = document.getElementById('passwordSection');
        const uploadSection = document.getElementById('uploadSection');
        
        function verifyPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                passwordSection.style.display = 'none';
                uploadSection.style.display = 'block';
            } else {
                alert('Incorrect password!');
            }
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        // Handle drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            uploadArea.classList.add('dragover');
        }

        function unhighlight(e) {
            uploadArea.classList.remove('dragover');
        }

        uploadArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type === 'application/pdf') {
                    uploadFile(file);
                } else {
                    alert('Please upload PDF files only');
                }
            });
        }

        // NLP pipeline stages shown in the tracker, in order
        const STAGE_KEYS = ['parse', 'split', 'embed', 'done'];

        // backend SSE step -> tracker stage
        const STEP_STAGE = {
            extracting_text: 'parse',
            splitting_text: 'split',
            chunks_created: 'split',
            embedding_stored: 'embed',
            done: 'done',
        };

        const STEP_LABELS = {
            extracting_text: () => `parsing pdf → extracting raw text`,
            splitting_text: () => `tokenizing text → splitting into chunks`,
            chunks_created: (d) => `chunked into ${d.total} segments`,
            embedding_stored: (d) => `embed + index chunk ${d.current}/${d.total}`,
            done: (d) => `${d.chunks_processed} chunks embedded & indexed`,
            error: (d) => `${d.message}`,
        };

        function createProgressPanel(file) {
            const panel = document.createElement('div');
            panel.className = 'progress-panel processing';
            panel._startTime = performance.now();
            panel.innerHTML = `
                <div class="term-header">
                    <div class="term-dots"><span></span><span></span><span></span></div>
                    <div class="term-title">${file.name}</div>
                    <div class="term-status"><span class="status-dot"></span><span class="status-text">running</span></div>
                </div>
                <div class="stage-tracker">
                    <div class="stage" data-stage="parse"><div class="dot"></div><div class="label">Parse</div></div>
                    <div class="stage-line"><div class="fill"></div></div>
                    <div class="stage" data-stage="split"><div class="dot"></div><div class="label">Split</div></div>
                    <div class="stage-line"><div class="fill"></div></div>
                    <div class="stage" data-stage="embed"><div class="dot"></div><div class="label">Embed</div></div>
                    <div class="stage-line"><div class="fill"></div></div>
                    <div class="stage" data-stage="done"><div class="dot"></div><div class="label">Done</div></div>
                </div>
                <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
                <div class="progress-counter"></div>
                <ul class="progress-log"></ul>
            `;
            fileList.prepend(panel);
            return panel;
        }

        function setStage(panel, key, state) {
            const idx = STAGE_KEYS.indexOf(key);
            const stageEl = panel.querySelector(`.stage[data-stage="${key}"]`);
            stageEl.classList.remove('active', 'complete', 'error');
            stageEl.classList.add(state);
            if (idx > 0) {
                panel.querySelectorAll('.stage-line .fill')[idx - 1].style.width = '100%';
            }
        }

        function appendLog(panel, step, data) {
            const tag = STEP_STAGE[step] || step;
            const label = STEP_LABELS[step] ? STEP_LABELS[step](data) : step;
            const elapsed = ((performance.now() - panel._startTime) / 1000).toFixed(2).padStart(5, '0');
            const li = document.createElement('li');
            li.className = `tag-${tag}`;
            li.innerHTML = `<span class="ts">+${elapsed}s</span><span class="msg">${label}</span>`;
            const log = panel.querySelector('.progress-log');
            log.appendChild(li);
            log.scrollTop = log.scrollHeight;
        }

        function logStep(panel, step, data) {
            appendLog(panel, step, data);

            if (step === 'extracting_text') setStage(panel, 'parse', 'active');
            if (step === 'splitting_text') { setStage(panel, 'parse', 'complete'); setStage(panel, 'split', 'active'); }

            if (step === 'embedding_stored') {
                if (data.current === 1) { setStage(panel, 'split', 'complete'); setStage(panel, 'embed', 'active'); }
                panel.querySelector('.progress-bar-fill').style.width = `${(data.current / data.total) * 100}%`;
                panel.querySelector('.progress-counter').textContent = `${data.current} / ${data.total} chunks`;
            }

            if (step === 'done') {
                setStage(panel, 'embed', 'complete');
                setStage(panel, 'done', 'complete');
                panel.querySelector('.progress-bar-fill').style.width = '100%';
                panel.classList.replace('processing', 'done');
                panel.querySelector('.status-text').textContent = 'done';
            }

            if (step === 'error') {
                panel.classList.replace('processing', 'error');
                panel.querySelector('.status-text').textContent = 'failed';
                const activeStage = panel.querySelector('.stage.active');
                if (activeStage) activeStage.classList.replace('active', 'error');
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('pdf_file', file);
            const panel = createProgressPanel(file);

            try {
                const response = await fetch('https://nlp.adityanalawade.in/api/upload_pdf', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok || !response.body) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || 'Upload failed');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let success = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const rawEvent = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (!rawEvent.startsWith('data: ')) continue;

                        const evt = JSON.parse(rawEvent.slice(6));
                        logStep(panel, evt.step, evt);
                        if (evt.step === 'done') success = evt.success;
                        if (evt.step === 'error') throw new Error(evt.message);
                    }
                }

                displayFile(file, success);
            } catch (error) {
                console.error('Upload error:', error);
                logStep(panel, 'error', { message: error.message });
                displayFile(file, false);
            }
        }

        function displayFile(file, success) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <span>${file.name}</span>
                <span>
                    ${(file.size / 1024).toFixed(2)} KB 
                    ${success ? 
                        '<i class="fas fa-check" style="color: #00f0ff;"></i>' : 
                        '<i class="fas fa-times" style="color: #ff4444;"></i>'}
                </span>
            `;
            fileList.appendChild(fileItem);
        }
    </script>
</body>
</html>
